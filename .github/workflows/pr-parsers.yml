name: Test parsers

on:
  pull_request:
    paths:
      - '**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      parsers: ${{ steps.affected.outputs.parsers }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect affected parsers 🔎
      id: affected
      uses: ./tools/action-detect-affected-parsers
      with:
        base-sha: ${{ github.event.pull_request.base.sha }}

  test:
    needs: detect
    if: needs.detect.outputs.parsers != '[]'
    runs-on: ubuntu-latest
    name: ${{ matrix.parser }}
    strategy:
      fail-fast: false
      matrix:
        parser: ${{ fromJSON(needs.detect.outputs.parsers) }}
    env:
      PARSER: ${{ matrix.parser }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Set up node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install dependencies ⏬
      run: npm ci

    # npm symlinks local packages, so geostyler-style must be built before the parser.
    - name: Build geostyler-style 🧱
      run: npm run build -w packages/geostyler-style-monorepo-test

    - name: Build artifacts 🏗️
      run: npm run build -w "$PARSER"

    - name: Lint code 💄
      run: npm run lint -w "$PARSER"

    - name: Check code 🔍
      run: npm run check -w "$PARSER"

    - name: Test code ✅
      run: npm test -w "$PARSER"

    - name: Publish to coveralls ⭐
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
