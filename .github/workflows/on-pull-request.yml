name: Test Pull Request

on: pull_request

jobs:
  build:
    # commented out for now, because on windows linting fails with bun (same error as with older node versions on ubuntu)
    # strategy:
    #   matrix:
    #     os: [ubuntu-latest, windows-latest]

    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Set up node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies ⏬
      run: npm ci

    - name: Lint code 💄
      run: npm --workspaces run lint

    - name: Check code 🔍
      run: npm --workspaces run check

    - name: Test code ✅
      run: npm --workspaces test --coverage --coverage-reporter=lcov

    - name: Build artifacts 🏗️
      run: npm --workspaces run build

    - name: Publish to coveralls ⭐
      # coverage/lcov.info was generated in the previous npm run build step
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
