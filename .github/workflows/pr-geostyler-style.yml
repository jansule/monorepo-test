name: Test geostyler-style-monorepo-test

on:
  pull_request:
    # order matters: later patterns override earlier ones
    paths:
      - '**'
      - '!packages/**'
      - 'packages/geostyler-style-monorepo-test/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Set up node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install dependencies ⏬
      run: npm ci

    - name: Build artifacts 🏗️
      run: npm run build -w packages/geostyler-style-monorepo-test

    - name: Lint code 💄
      run: npm run lint -w packages/geostyler-style-monorepo-test

    - name: Check code 🔍
      run: npm run check -w packages/geostyler-style-monorepo-test

    - name: Test code ✅
      run: npm test -w packages/geostyler-style-monorepo-test

    - name: Publish to coveralls ⭐
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
